name: AuraFi CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q services database analytics
      - name: Test API, services and contracts
        run: python -m unittest discover -s tests -t . -p "test*.py"
      - name: Validate analytics contract
        run: python analytics/validate_pipeline.py

  web-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-widget/package-lock.json
      - run: npm ci
      - run: npm run build

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS app
        run: >-
          xcodebuild build
          -project apps/ios/AuraFi.xcodeproj
          -scheme AuraFi
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/aurafi-ci-derived-data
          CODE_SIGNING_ALLOWED=NO
