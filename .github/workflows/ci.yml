name: AuraFi CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Postgres matches the managed instance used in production, so the adapter
    # in database/postgres/ is exercised here instead of being skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurafi
          POSTGRES_PASSWORD: aurafi
          POSTGRES_DB: aurafi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver and client
        run: |
          python -m pip install --quiet "psycopg[binary]"
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        env:
          PGPASSWORD: aurafi
        run: |
          for f in database/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U aurafi -d aurafi_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Compile Python
        run: python -m compileall -q services database analytics
      - name: Test API, services and contracts
        env:
          AURAFI_TEST_DATABASE_URL: "host=localhost port=5432 user=aurafi password=aurafi dbname=aurafi_test"
        run: python -m unittest discover -s tests -t . -p "test*.py"
      - name: Validate analytics contract
        run: python analytics/validate_pipeline.py

  web-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-widget/package-lock.json
      - run: npm ci
      - run: npm run build

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS app
        run: >-
          xcodebuild build
          -project apps/ios/AuraFi.xcodeproj
          -scheme AuraFi
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/aurafi-ci-derived-data
          CODE_SIGNING_ALLOWED=NO
