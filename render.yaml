# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  # Plano pago do banco de produção, informado pelo grupo em 2026-11-15. O
  # plano gratuito deixaria o banco inacessível 30 dias após a criação.
  - name: aurafi-db
    databaseName: aurafi
    user: aurafi
    plan: basic-256mb

services:
  - type: web
    name: aurafi-api
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    # Publica só depois que os checks do GitHub (.github/workflows/ci.yml)
    # passam no commit; com "commit", a Render publicava antes do fim do CI.
    autoDeployTrigger: checksPass
    disk:
      name: aurafi-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AURAFI_ENV
        value: production
      - key: AURAFI_API_HOST
        value: 0.0.0.0
      - key: AURAFI_ALLOWED_ORIGINS
        sync: false
      - key: AURAFI_TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aurafi-db
          property: connectionString
      - key: AURAFI_DB_PATH
        value: /data/aurafi.sqlite3
      # Limpeza de retenção (database/account_data.py), no máximo uma vez por
      # hora: códigos vencidos, respostas de idempotência com mais de 24 h e
      # contas nunca confirmadas há mais de 7 dias. Em produção, sem esta
      # variável, a limpeza fica desligada.
      - key: AURAFI_RETENTION_PURGE
        value: "true"
      - key: AURAFI_ALLOW_SELF_SIGNUP
        value: "true"
      - key: AURAFI_OTP_PROVIDER
        value: smtp
      - key: AURAFI_OTP_SMTP_HOST
        value: smtp.resend.com
      - key: AURAFI_OTP_SMTP_PORT
        value: "587"
      - key: AURAFI_OTP_SMTP_STARTTLS
        value: "true"
      - key: AURAFI_OTP_SMTP_SSL
        value: "false"
      - key: AURAFI_OTP_FROM_EMAIL
        sync: false
      - key: AURAFI_OTP_SMTP_USERNAME
        value: resend
      - key: AURAFI_OTP_SMTP_PASSWORD
        sync: false
      - key: AURAFI_OTP_HMAC_PEPPER
        generateValue: true
      - key: AURAFI_OTP_REQUEST_LIMIT
        value: "5"
      - key: AURAFI_OTP_VERIFY_LIMIT
        value: "10"
      - key: AURAFI_ENABLE_MARKET_NETWORK
        value: "true"
      - key: AURAFI_MARKET_MODE
        value: live
      - key: AURAFI_MARKET_BASE_URL
        value: https://yields.llama.fi
      - key: AURAFI_MARKET_ENDPOINT
        value: /pools
      - key: AURAFI_LLM_PROVIDER
        value: anthropic
      - key: AURAFI_LLM_REQUEST_LIMIT
        value: "30"
      - key: AURAFI_ANTHROPIC_API_KEY
        sync: false
      - key: AURAFI_ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: AURAFI_ANTHROPIC_MAX_TOKENS
        value: "700"
      - key: AURAFI_ANTHROPIC_TIMEOUT
        value: "20"

  - type: web
    name: aurafi-web-widget
    runtime: static
    rootDir: apps/web-widget
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    # The campaign page lives at /entenda/ (dist/entenda/index.html). A rewrite,
    # not a redirect, serves it at /entenda too and cannot loop.
    routes:
      - type: rewrite
        source: /entenda
        destination: /entenda/index.html
    # The rest of the Content-Security-Policy ships as a <meta> tag injected at
    # build time (vite.config.ts); frame-ancestors only works as a header.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
