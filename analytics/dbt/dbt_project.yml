name: aurafi_analytics
version: '1.0.0'
config-version: 2

profile: aurafi_analytics

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
analysis-paths: [analyses]
macro-paths: [macros]
snapshot-paths: [snapshots]

models:
  aurafi_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    dimensions:
      +materialized: view
    facts:
      +materialized: view
    marts:
      +materialized: view

seeds:
  aurafi_analytics:
    +quote_columns: true
    +column_types:
      is_test_data: boolean
      channel_simulated: boolean
      decision_accepted: boolean
      is_stale: boolean
      read_only: boolean
      fallback_used: boolean
      escalation_flag: boolean

