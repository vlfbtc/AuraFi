version: 2

models:
  - name: stg_test_events
    description: "Eventos sintéticos controlados; contém apenas identificadores pseudônimos e medidas, nunca texto conversacional."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: [recommendation, yield_observation, conversation_session]
      - name: test_case_id
        tests: [not_null]
      - name: is_test_data
        tests:
          - not_null
          - accepted_values:
              values: [true]
      - name: occurred_at
        tests: [not_null]
      - name: user_pseudo_id
        tests: [not_null]
      - name: channel_name
        tests:
          - not_null
          - accepted_values:
              values: [web_widget, ios_app, whatsapp_business, telegram, simulated]

  - name: stg_fact_enrichment
    description: "Medidas sintéticas adicionais necessárias ao dicionário dimensional e às métricas do hub."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: csat_score
        description: "CSAT opcional de 1 a 5; faixa validada por teste singular."
      - name: context_loss_events
        description: "Quantidade de perdas de contexto detectadas na sessão."

  - name: dim_tempo
    description: "Dimensão conformada horária UTC de 2020 a 2040 para análises intradia."
    columns:
      - name: time_key
        tests: [not_null, unique]
      - name: hour_at
        tests: [not_null, unique]
      - name: calendar_date
        tests: [not_null]
      - name: hour_of_day
        tests: [not_null]
      - name: day_period
        tests:
          - not_null
          - accepted_values:
              values: [madrugada, manha, tarde, noite]
      - name: is_weekday
        tests: [not_null]
      - name: is_business_day
        tests: [not_null]
      - name: is_fixed_national_holiday
        tests: [not_null]
      - name: calendar_year
        tests: [not_null]
      - name: year_month
        tests: [not_null]

  - name: dim_usuario
    description: "Dimensão conformada de usuário pseudonimizado em SCD Tipo 2; não contém e-mail, telefone, CPF, wallet ou texto."
    columns:
      - name: user_key
        tests: [not_null, unique]
      - name: user_pseudo_id
        tests: [not_null]
      - name: user_version
        tests: [not_null]
      - name: age_band
        tests:
          - accepted_values:
              values: [18-24, 25-34, 35-44, 45-54, 55+]
      - name: plan
        tests:
          - not_null
          - accepted_values:
              values: [free, premium, plus]
      - name: registered_on
        tests: [not_null]
      - name: acquisition_channel
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: is_test_data
        tests:
          - not_null
          - accepted_values:
              values: [true]

  - name: dim_perfil_risco
    description: "Dimensão conformada com os três perfis e thresholds de elegibilidade."
    columns:
      - name: risk_profile_key
        tests: [not_null, unique]
      - name: declared_profile
        tests:
          - not_null
          - unique
          - accepted_values:
              values: [conservative, moderate, aggressive]
      - name: profile_code
        tests:
          - not_null
          - unique
          - accepted_values:
              values: [CONS, MOD, ARJ]
      - name: max_loss_tolerance_percent
        tests: [not_null]
      - name: max_healthy_apy_percent
        tests: [not_null]
      - name: minimum_tvl_usd
        tests: [not_null]
      - name: audit_required
        tests: [not_null]

  - name: dim_protocolo
    description: "Atributos desnormalizados do protocolo para o star schema puro."
    columns:
      - name: protocol_key
        tests: [not_null, unique]
      - name: protocol_name
        tests: [not_null, unique]
      - name: category
        tests: [not_null]
      - name: primary_blockchain
        tests: [not_null]
      - name: security_score
        tests: [not_null]
      - name: audit_status
        tests:
          - not_null
          - accepted_values:
              values: [audited, partially_audited, not_audited]
      - name: insurance_available
        tests: [not_null]

  - name: dim_ativo
    description: "Ativo analítico sem vínculo com carteira, saldo ou execução."
    columns:
      - name: asset_key
        tests: [not_null, unique]
      - name: asset_symbol
        tests: [not_null, unique]
      - name: full_name
        tests: [not_null]
      - name: asset_type
        tests: [not_null]
      - name: backing_type
        tests: [not_null]
      - name: peg_target
        tests: [not_null]

  - name: dim_blockchain
    description: "Rede desnormalizada com custo, capacidade, finalidade e bridge."
    columns:
      - name: blockchain_key
        tests: [not_null, unique]
      - name: blockchain_name
        tests: [not_null, unique]
      - name: blockchain_type
        tests: [not_null]
      - name: consensus
        tests: [not_null]
      - name: native_token
        tests: [not_null]
      - name: average_gas_fee_usd
        tests: [not_null]
      - name: finality_seconds
        tests: [not_null]

  - name: dim_canal
    description: "Canal conformado do hub, incluindo adaptador, capacidades e custo estimado."
    columns:
      - name: channel_key
        tests: [not_null, unique]
      - name: channel_name
        tests:
          - not_null
          - unique
          - accepted_values:
              values: [web_widget, ios_app, whatsapp_business, telegram, simulated]
      - name: channel_type
        tests: [not_null]
      - name: adapter
        tests: [not_null]
      - name: adapter_version
        tests: [not_null]
      - name: push_supported
        tests: [not_null]
      - name: attachment_supported
        tests: [not_null]
      - name: simulated
        tests: [not_null]

  - name: fato_recomendacao
    description: "Grão: uma recomendação emitida para um usuário, canal e momento."
    columns:
      - name: recommendation_key
        tests: [not_null, unique]
      - name: recommendation_id
        tests: [not_null, unique]
      - name: time_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_tempo')", field: time_key}
      - name: user_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_usuario')", field: user_key}
      - name: risk_profile_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_perfil_risco')", field: risk_profile_key}
      - name: protocol_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_protocolo')", field: protocol_key}
      - name: asset_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_ativo')", field: asset_key}
      - name: blockchain_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_blockchain')", field: blockchain_key}
      - name: channel_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_canal')", field: channel_key}
      - name: recommended_apy_percent
        tests: [not_null]
      - name: confidence_score
        tests: [not_null]
      - name: decision_accepted
        tests: [not_null]
      - name: prompt_version
        tests: [not_null]
      - name: is_test_data
        tests: [not_null]

  - name: fato_yield_observacao
    description: "Grão: snapshot de pool por protocolo, ativo, blockchain e momento, proveniente da DeFiLlama."
    columns:
      - name: yield_observation_key
        tests: [not_null, unique]
      - name: pool_name
        tests: [not_null]
      - name: time_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_tempo')", field: time_key}
      - name: risk_profile_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_perfil_risco')", field: risk_profile_key}
      - name: protocol_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_protocolo')", field: protocol_key}
      - name: asset_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_ativo')", field: asset_key}
      - name: blockchain_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_blockchain')", field: blockchain_key}
      - name: yield_apy_percent
        tests: [not_null]
      - name: base_apr_percent
        tests: [not_null]
      - name: incentive_apy_percent
        tests: [not_null]
      - name: tvl_usd
        tests: [not_null]
      - name: protocol_tvl_snapshot_usd
        tests: [not_null]
      - name: apy_volatility_30d
        tests: [not_null]
      - name: impermanent_loss_30d_percent
        tests: [not_null]
      - name: liquidity_score
        tests: [not_null]
      - name: recommendable_flag
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values: {values: [defillama]}
      - name: mode
        tests:
          - not_null
          - accepted_values: {values: [test, fallback, live, cache]}
      - name: read_only
        tests:
          - not_null
          - accepted_values: {values: [true]}

  - name: fato_interacao_conversacional
    description: "Grão: uma sessão conversacional; sessões têm mensagens contíguas com gap inferior a 30 minutos."
    columns:
      - name: conversation_key
        tests: [not_null, unique]
      - name: session_id
        tests: [not_null, unique]
      - name: time_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_tempo')", field: time_key}
      - name: user_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_usuario')", field: user_key}
      - name: risk_profile_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_perfil_risco')", field: risk_profile_key}
      - name: channel_key
        tests:
          - not_null
          - relationships: {to: "ref('dim_canal')", field: channel_key}
      - name: user_message_count
        tests: [not_null]
      - name: aura_message_count
        tests: [not_null]
      - name: total_llm_tokens
        tests: [not_null]
      - name: main_topic
        tests:
          - not_null
          - accepted_values:
              values: [risk_profile, recommendation, simulation, general_question, support, kyc]
      - name: csat_score
        description: "Opcional; quando preenchido deve estar entre 1 e 5."
      - name: escalation_flag
        tests: [not_null]
      - name: generated_recommendation
        tests: [not_null]
      - name: context_loss_events
        tests: [not_null]
      - name: premium_conversion_flag
        tests: [not_null]
      - name: is_test_data
        tests: [not_null]

  - name: aura_star_schema
    description: "Camada de consumo unificada que preserva os três grãos e as sete dimensões."
    columns:
      - name: mart_row_key
        tests: [not_null, unique]
      - name: record_type
        tests:
          - not_null
          - accepted_values:
              values: [recommendation, yield_observation, conversation_session]
      - name: grain
        tests: [not_null]
      - name: time_key
        tests: [not_null]

  - name: recommendation_metrics
    description: "Aceitação, ticket simulado, confiança, decisão, tokens e custo por dia/canal/perfil/protocolo."
    columns:
      - name: calendar_date
        tests: [not_null]
      - name: channel_key
        tests: [not_null]
      - name: risk_profile_key
        tests: [not_null]
      - name: protocol_key
        tests: [not_null]
      - name: recommendation_count
        tests: [not_null]
      - name: acceptance_rate
        tests: [not_null]

  - name: market_metrics
    description: "Evolução de APY, APR, incentivos, TVL, volatilidade, IL, liquidez, elegibilidade e frescor."
    columns:
      - name: calendar_date
        tests: [not_null]
      - name: observation_count
        tests: [not_null]
      - name: average_observed_apy_percent
        tests: [not_null]
      - name: recommendable_pool_rate
        tests: [not_null]
      - name: stale_observation_rate
        tests: [not_null]

  - name: hub_metrics
    description: "Engajamento, CSAT, custos, tokens, fallback, escalação, recomendação, conversão premium e perda de contexto."
    columns:
      - name: calendar_date
        tests: [not_null]
      - name: channel_key
        tests: [not_null]
      - name: risk_profile_key
        tests: [not_null]
      - name: session_count
        tests: [not_null]
      - name: channel_engagement_share
        tests: [not_null]
      - name: human_escalation_rate
        tests: [not_null]
      - name: premium_conversion_rate
        tests: [not_null]
      - name: context_loss_session_rate
        tests: [not_null]

  - name: cross_channel_metrics
    description: "Handoff cross-channel, retomada de sessão e eventos de perda de contexto por direção de canal."
    columns:
      - name: calendar_date
        tests: [not_null]
      - name: previous_channel_key
        tests: [not_null]
      - name: channel_key
        tests: [not_null]
      - name: cross_channel_handoff_count
        tests: [not_null]
      - name: cross_channel_handoff_rate
        tests: [not_null]
      - name: average_session_resumption_seconds
        tests: [not_null]
      - name: context_loss_events
        tests: [not_null]

  - name: product_metric_targets
    description: "Metas de Ano 3 publicadas; não mistura metas com valores observados."
    columns:
      - name: target_year
        tests: [not_null]
      - name: metric_name
        tests: [not_null, unique]
      - name: target_operator
        tests:
          - not_null
          - accepted_values: {values: [gte, lte]}
      - name: target_value
        tests: [not_null]
      - name: target_unit
        tests: [not_null]

seeds:
  - name: mvp_test_events
    description: "Eventos sintéticos básicos da jornada controlada."
  - name: mvp_fact_enrichment
    description: "Medidas sintéticas complementares, sem PII ou texto conversacional."
  - name: mvp_users
    description: "Versões SCD2 pseudonimizadas usadas pelo fixture."
  - name: mvp_risk_profiles
    description: "Catálogo sintético dos três perfis."
  - name: mvp_protocols
    description: "Catálogo sintético de protocolos."
  - name: mvp_assets
    description: "Catálogo sintético de ativos."
  - name: mvp_blockchains
    description: "Catálogo sintético de blockchains."
  - name: mvp_channels
    description: "Catálogo sintético de canais e capacidades."
  - name: mvp_product_targets
    description: "Metas estratégicas, separadas de valores realizados."
